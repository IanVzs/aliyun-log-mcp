[project]
name = "aliyun_log_mcp"
version = "0.1.0"
description = "MCP server for Aliyun SLS (Simple Log Service): bug investigation / log analysis / alert review, read-only by default."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ian" }]
dependencies = [
    "mcp[cli]>=1.2.0",
    "aliyun-log-python-sdk>=0.9.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
]

[project.scripts]
aliyun_log_mcp = "aliyun_log_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aliyun_log_mcp"]
